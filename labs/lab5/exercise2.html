<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambodia Admin Selection</title>

    <!-- DaisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
<p style="padding:10px 20px;"><a href="index.html" style="font-size:13px;color:#57606a;text-decoration:none;">&larr; Back to Lab 5</a></p>


<div class="card w-full max-w-lg bg-base-100 shadow-xl">
    <div class="card-body">
        <h2 class="card-title text-primary mb-4">Location Selector</h2>

        <form action="https://jsonplaceholder.typicode.com/posts" method="post">

            <div class="space-y-4">

                <!-- Province -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-bold">Province</span>
                    </label>
                    <select id="province" name="province" class="select select-bordered w-full">
                        <option value="" disabled selected>Select Province</option>
                    </select>
                </div>

                <!-- District -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-bold">District</span>
                    </label>
                    <select id="district" name="district" class="select select-bordered w-full" disabled>
                        <option value="" disabled selected>Select District</option>
                    </select>
                </div>

                <!-- Commune -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-bold">Commune</span>
                    </label>
                    <select id="commune" name="commune" class="select select-bordered w-full" disabled>
                        <option value="" disabled selected>Select Commune</option>
                    </select>
                </div>

                <!-- Village -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-bold">Village</span>
                    </label>
                    <select id="village" name="village" class="select select-bordered w-full" disabled>
                        <option value="" disabled selected>Select Village</option>
                    </select>
                </div>

            </div>

            <div class="card-actions justify-end mt-6">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="button" class="btn btn-error" onclick="window.location.reload()">Reset</button>
            </div>

        </form>
    </div>
</div>

<script>
const API_BASE = "https://corsproxy.io/?https://cambo-gazetteer.manethpak.dev/api/v1";

const selects = {
    province: document.getElementById('province'),
    district: document.getElementById('district'),
    commune: document.getElementById('commune'),
    village: document.getElementById('village')
};

// Populate select
function populateSelect(element, data, placeholder) {
    element.innerHTML = `<option value="" disabled selected>${placeholder}</option>`;

    if (!data || data.length === 0) {
        element.disabled = true;
        return;
    }

    data.forEach(item => {
        const option = document.createElement("option");
        option.value = item.code || item.id;
        option.textContent = `${item.name_en} (${item.name_km})`;
        element.appendChild(option);
    });

    element.disabled = false;
}

// Reset lower selects
function resetBelow(level) {
    const levels = ['province', 'district', 'commune', 'village'];
    const index = levels.indexOf(level);

    for (let i = index + 1; i < levels.length; i++) {
        const el = selects[levels[i]];
        el.innerHTML = `<option value="" disabled selected>Select ${levels[i][0].toUpperCase() + levels[i].slice(1)}</option>`;
        el.disabled = true;
    }
}

// Fetch provinces
async function fetchProvinces() {
    try {
        const res = await fetch(`${API_BASE}/provinces`);
        const result = await res.json();
        populateSelect(selects.province, result.data, "Select Province");
    } catch (error) {
        console.error("Error fetching provinces:", error);
        alert("Failed to load provinces.");
    }
}

// Province change
selects.province.addEventListener("change", async (e) => {
    resetBelow("province");

    if (!e.target.value) return;

    try {
        const res = await fetch(`${API_BASE}/districts?province=${e.target.value}`);
        const result = await res.json();
        populateSelect(selects.district, result.data, "Select District");
    } catch (error) {
        console.error("Error fetching districts:", error);
    }
});

// District change
selects.district.addEventListener("change", async (e) => {
    resetBelow("district");

    if (!e.target.value) return;

    try {
        const res = await fetch(`${API_BASE}/communes?district=${e.target.value}`);
        const result = await res.json();
        populateSelect(selects.commune, result.data, "Select Commune");
    } catch (error) {
        console.error("Error fetching communes:", error);
    }
});

// Commune change
selects.commune.addEventListener("change", async (e) => {
    resetBelow("commune");

    if (!e.target.value) return;

    try {
        const res = await fetch(`${API_BASE}/villages?commune=${e.target.value}`);
        const result = await res.json();
        populateSelect(selects.village, result.data, "Select Village");
    } catch (error) {
        console.error("Error fetching villages:", error);
    }
});

// Initialize
fetchProvinces();
</script>

</body>
</html>
