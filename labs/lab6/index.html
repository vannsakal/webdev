<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="center-page">
<p style="padding:10px 20px;position:absolute;top:0;left:0;"><a href="../../index.html" style="font-size:13px;color:#57606a;text-decoration:none;">&larr; Back to Labs</a></p>


  <div class="card">
    <h1>Login</h1>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" />
    </div>

    <p id="error-msg" class="error-msg">Please enter your username!</p>

    <button class="btn btn-primary" onclick="handleLogin()">Login</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
